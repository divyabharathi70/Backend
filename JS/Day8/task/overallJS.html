<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        console.log("TASK 1 - ELECTRICITY BILL CALCULATION")
        // Create variables for:
        // customerName
        // unitsConsumed
        // Rules:
        // - First 100 units → ₹2 per unit
        // - 101 to 200 units → ₹3 per unit
        // - Above 200 units → ₹5 per unit
        // Calculate the customer's electricity bill.
        // Example:
        // unitsConsumed = 250
        // Concepts:
        // Variables, Number datatype, Operators, if/else

        let customerName = "Divya"
        let unitsConsumed = 250
        let bill = 0

        if (unitsConsumed <= 100) {
            bill = unitsConsumed * 2
        }
        else if (unitsConsumed <= 200) {
            bill = (100 * 2) + ((unitsConsumed - 100) * 3)
        }
        else {
            bill = (100 * 2) + (100 * 3) + ((unitsConsumed - 200) * 5)
        }

        console.log("Customer:", customerName)
        console.log("Electricity Bill: ₹" + bill)


        console.log("TASK 2 - ATM CASH WITHDRAWAL")
        // Create:
        // balance = 15000
        // withdrawAmount = 4000
        // Rules:
        // - Withdrawal amount must be greater than 0.
        // - Amount must be a multiple of 500.
        // - Amount must not exceed the balance.
        // - If everything is valid, deduct the amount.
        // - Otherwise display the appropriate error message.

        let balance = 15000
        let withdrawAmount = 4000

        if (withdrawAmount <= 0) {
            console.log("Invalid withdrawal amount")
        }
        else if (withdrawAmount % 500 != 0) {
            console.log("Amount must be a multiple of 500")
        }
        else if (withdrawAmount > balance) {
            console.log("Insufficient balance")
        }
        else {
            balance = balance - withdrawAmount
            console.log("Withdrawal Successful")
            console.log("Remaining Balance:", balance)
        }


        console.log("TASK 3 - EMPLOYEE LOGIN ATTEMPTS")
        // Create:
        // correctPin = 1234
        // Allow maximum 3 login attempts.
        // Rules:
        // - Check entered PIN.
        // - If correct, display "Login Successful" and stop the loop.
        // - If incorrect, continue.
        // - After 3 failed attempts, display "Account Blocked".

        let correctPin = 1234
        let enteredPins = [1111, 2222, 1234]

        for (let i = 0; i < 3; i++) {

            let enteredPin = enteredPins[i]

            if (enteredPin == correctPin) {
                console.log("Login Successful")
                break
            }
            else {
                console.log("Incorrect PIN")
            }

            if (i == 2) {
                console.log("Account Blocked")
            }
        }


        console.log("TASK 4 - MULTIPLICATION BILL TABLE")
        // A shop sells 5 products.
        // Use a loop to display quantity and total price for a product costing ₹250.
        // Expected:
        // Quantity 1 = ₹250
        // Quantity 2 = ₹500
        // Quantity 3 = ₹750
        // Quantity 4 = ₹1000
        // Quantity 5 = ₹1250

        let price = 250

        for (let quantity = 1; quantity <= 5; quantity++) {
            let total = quantity * price
            console.log("Quantity " + quantity + " = ₹" + total)
        }


        console.log("TASK 5 - SEAT BOOKING DISPLAY")
        // A theatre has:
        // 3 rows
        // 5 seats in each row
        // Use nested loops to display:
        // Row 1 - Seat 1
        // Row 1 - Seat 2
        // ...
        // Row 3 - Seat 5

        let rows = 3
        let seats = 5

        for (let i = 1; i <= rows; i++) {
            for (let j = 1; j <= seats; j++) {
                console.log("Row " + i + " - Seat " + j)
            }
        }


        console.log("TASK 6 - DELIVERY CHARGE FUNCTION")
        // Create a function:
        // calculateDelivery(amount)
        // Rules:
        // - Order ₹1000 or above → Free Delivery
        // - Order ₹500 to ₹999 → ₹50 delivery charge
        // - Below ₹500 → ₹100 delivery charge
        // Return the final payable amount.

        function calculateDelivery(amount) {
            let deliveryCharge = 0
            if (amount >= 1000) {
                deliveryCharge = 0
            }
            else if (amount >= 500) {
                deliveryCharge = 50
            }
            else {
                deliveryCharge = 100
            }

            let finalAmount = amount + deliveryCharge
            return finalAmount
        }

        console.log(calculateDelivery(1200))
        console.log(calculateDelivery(700))
        console.log(calculateDelivery(300))


        console.log("TASK 7 - FIND HIGHEST SALES")
        // Create:
        // let sales = [12000, 18000, 9500, 25000, 16000];
        // Find the highest sales amount.
        // Condition:
        // - Use a loop.
        // - Do not use Math.max().
        // - Do not use sort().
        // Expected:
        // 25000

        let sales = [12000, 18000, 9500, 25000, 16000]
        let highest = sales[0]
        for (let i = 1; i < sales.length; i++) {

            if (sales[i] > highest) {
                highest = sales[i]
            }
        }

        console.log("Highest Sales:", highest)


        console.log("TASK 8 - PALINDROME ARRAY")
        // Create:
        // let numbers = [1, 2, 3, 2, 1];
        // Check whether the array is palindrome.
        // Rules:
        // - Compare values from beginning and ending.
        // - Do not use reverse().
        // Expected:
        // Palindrome

        let numbers = [1, 2, 3, 2, 1]
        let isPalindrome = true
        for (let i = 0; i < numbers.length / 2; i++) {
            let j = numbers.length - 1 - i
            if (numbers[i] != numbers[j]) {
                isPalindrome = false
                break
            }
        }

        if (isPalindrome) {
            console.log("Palindrome")
        }
        else {
            console.log("Not Palindrome")
        }


        console.log("TASK 9 - STUDENT RESULT PROCESSING")
        // Create:
        // let marks = [45, 78, 32, 90, 67];
        // Complete these operations:
        // 1. Use map() to add 5 grace marks to every mark.
        // 2. Use filter() to get marks 50 or above.
        // 3. Print both results.
        // Concepts:
        // Array, map(), filter(), callback function

        let marks = [45, 78, 32, 90, 67]
        let graceMarks = marks.map((mark)=> {
            return mark + 5
        })

        let passedMarks = graceMarks.filter((mark)=> {
            return mark >= 50
        })

        console.log("Grace Marks:", graceMarks)
        console.log("Passed Marks:", passedMarks)


        console.log("TASK 10 - EMPLOYEE SEARCH")
        // Create:
        // let employees = [
        // { id: 101, name: "Arun", salary: 25000 },
        // { id: 102, name: "Priya", salary: 35000 },
        // { id: 103, name: "Kumar", salary: 30000 }
        // ];
        // Find the employee whose id is 102.
        // Then print:
        // - Employee name

        let employees = [

            { id: 101, name: "Arun", salary: 25000 },
            { id: 102, name: "Priya", salary: 35000 },
            { id: 103, name: "Kumar", salary: 30000 }

        ]

        let employee = employees.find(function(emp) {
            return emp.id == 102
        })

        console.log("Employee Name:", employee.name)
        console.log("Employee Salary:", employee.salary)


        console.log("TASK 11 - SHOPPING CART TOTAL")
        // Create:
        // let cart = [
        // { name: "Shirt", price: 1000 },
        // { name: "Shoes", price: 2500 },
        // { name: "Bag", price: 1500 }
        // ];
        // Calculate the total cart amount using reduce().
        // Expected:
        // 5000

        let cart = [
            { name: "Shirt", price: 1000 },
            { name: "Shoes", price: 2500 },
            { name: "Bag", price: 1500 }
        ]

        let cartTotal = cart.reduce(function(accumulator, item) {
            return accumulator + item.price
        }, 0)

        console.log("Total Cart Amount:", cartTotal)


        console.log("TASK 12 - PRIVATE BANK BALANCE")
        // Create a function:
        // createAccount()
        // Inside the function:
        // let balance = 5000;
        // Return another function.
        // The returned function should:
        // - Receive deposit amount.
        // - Add amount to balance.
        // - Return updated balance.
        // Store the returned function in:
        // let deposit = createAccount();

        function createAccount() {
            let accountBalance = 5000
            return function(depositAmount) {
                accountBalance = accountBalance + depositAmount
                return accountBalance
            }
        }

        let deposit = createAccount()

        console.log(deposit(1000))
        console.log(deposit(2000))
        console.log(deposit(500))


        console.log("TASK 13 - ORDER CALLBACK")
        // Create:
        // processOrder(productName, callback)
        // Requirements:
        // - Print "Processing Laptop".
        // - After 2 seconds, send "Order Confirmed" to the callback.
        // - Print the result inside callback.
        // Expected:
        // Processing Laptop
        // After 2 seconds:
        // Order Confirmed

        function processOrder(productName, callback) {
            console.log("Processing " + productName)
            setTimeout(function() {
                callback("Order Confirmed")
            }, 2000)
        }

        processOrder("Laptop", function(result) {
            console.log(result)
        })


console.log("TASK 14 - PAYMENT USING PROMISE")

function makePayment(amount) {
    return new Promise((resolve, reject) => {

        if (amount > 0) {
            resolve("Payment Successful")
        }
        else {
            reject("Invalid Payment Amount")
        }

    })

}

makePayment(2500)
    .then((result) => {
        console.log(result)
    })
    .catch((error) => {
        console.log(error)
    })

makePayment(0)
    .then((result) => {
        console.log(result)
    })
    .catch((error) => {
        console.log(error)
    })

        console.log("TASK 15 - COMPLETE ORDER USING ASYNC/AWAIT")
        // Create a Promise-based function:
        // checkStock(stock)
        // Rules:
        // - stock > 0 → resolve "Stock Available"
        // - stock <= 0 → reject "Out of Stock"
        // Create:
        // placeOrder()
        // Requirements:
        // - Make placeOrder() an async function.
        // - Call checkStock() using await.
        // - Store the returned result.
        // - Print the result.
        // - If successful, print "Order Placed".
        // - Handle errors using try/catch.

        function checkStock(stock) {

            return new Promise(function(resolve, reject) {
                if (stock > 0) {
                    resolve("Stock Available")
                }
                else {
                    reject("Out of Stock")
                }
            })
        }

        async function placeOrder() {
            try {
                let result = await checkStock(10)
                console.log(result)
                console.log("Order Placed")
            }
            catch(error) {
                console.log(error)
            }
        }

        placeOrder()
    </script>
